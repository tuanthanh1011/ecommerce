services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-st_cms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10
    # Not exposed to the host on purpose — only reachable from the `api`
    # container on the compose network. Local dev's docker-compose.yml maps
    # 5433 for convenience; production doesn't need Postgres public.

  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY_ID}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_ACCESS_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_BUCKET_NAME:-media}
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    volumes:
      - ./infra/garage/garage.prod.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - '3900:3900' # S3 API — presigned PUT uploads go straight here from the admin browser
      - '3902:3902' # public website endpoint — serves uploaded files (GET only)
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/tuanthanh1011/ecommerce-api:latest
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    ports:
      - '3001:3001'

  web:
    image: ghcr.io/tuanthanh1011/ecommerce-web:latest
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '80:80'

volumes:
  pgdata:
  garage_meta:
  garage_data:
